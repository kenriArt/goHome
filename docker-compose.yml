
services:
  gotraker:
    build: .
    container_name: gotraker-api
    ports:
     - "8080:8080"
    depends_on:
      - postgres
      - redis
      - kafka
    env_file:
      - .env
  postgres:
    image: postgres:16
    container_name: gofinance-db
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    env_file:
      - .env
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
  redis:
    image: redis:7-alpine
    container_name: local_redis
    ports:
      - "6379:6379" # Пробрасываем стандартный порт наружу
    volumes:
      - redis_data:/data
    restart: always
  kafka:
    image: confluentinc/cp-kafka:7.5.0
    container_name: local_kafka
    ports:
      - "9092:9092" # Порт для подключения вашего Go-кода (localhost:9092)
    environment:
      # Настройки для работы Kafka без Zookeeper (режим KRaft)
      KAFKA_NODE_ID: 1
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: 'CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT'
      KAFKA_ADVERTISED_LISTENERS: 'PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092'
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_PROCESS_ROLES: 'broker,controller'
      KAFKA_CONTROLLER_QUORUM_VOTERS: '1@kafka:29093'
      KAFKA_LISTENERS: 'PLAINTEXT://0.0.0.0:29092,CONTROLLER://0.0.0.0:29093,PLAINTEXT_HOST://0.0.0.0:9092'
      KAFKA_INTER_BROKER_LISTENER_NAME: 'PLAINTEXT'
      KAFKA_CONTROLLER_LISTENER_NAMES: 'CONTROLLER'
      KAFKA_LOG_DIRS: '/tmp/kraft-combined-logs'
      CLUSTER_ID: 'MkU3OEVBNTcwNTJENDM2Qk' # Уникальный ID кластера
    volumes:
      - kafka_data:/var/lib/kafka/data
    restart: always
volumes:
  postgres_data:
  redis_data:
  kafka_data: